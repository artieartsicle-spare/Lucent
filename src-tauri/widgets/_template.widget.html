<!doctype html>
<!--
  A Lucent widget is ONE file: this one. Save it in this folder as  something.widget.html  and it appears in the
  gallery (Edit Widgets > "My Widgets") right away. Edit + save and every copy on your desktop reloads live.
  Files starting with _ are ignored, so this template never shows up.

  The settings below are <meta> tags:
    widget-name         name in the gallery
    widget-description  one line under it
    widget-family       gallery category (default: My Widgets)
    widget-size         S, M, L, XL, XXL; list several: "S, M"  (S 158x158, M 338x158, L 338x338, XL 698x338, XXL 698x698)
    widget-interactive  "true" if it has buttons / text boxes to use on the desktop (otherwise clicks pass through)
    widget-fields       Edit Widget options to offer: place, unit, h24  (read them from glass.cfg)

  Your code runs in a sandbox: no access to your files or the rest of the app. https requests work. What you get is the
  `glass` object (see the end of this file); the CSS variables --fg --sub --sub2 --hair --red --blue --card follow the
  widget's appearance (light / dark / glass) automatically.
-->
<meta name="widget-name" content="My Widget">
<meta name="widget-description" content="Says hello and shows the time.">
<meta name="widget-family" content="My Widgets">
<meta name="widget-size" content="S, M">

<style>
  body { display: flex; flex-direction: column; justify-content: space-between; }
  .time { font: 600 38px/1 Inter, system-ui, sans-serif; letter-spacing: -.02em; }
  .hi   { font-size: 13px; color: var(--sub); }
</style>

<div class="hi" id="hi">Hello</div>
<div class="time" id="t">--:--</div>

<script>
  // glass.size is 'S', 'M', ... so one file can lay itself out differently per size
  glass.ready(() => {
    document.getElementById('hi').textContent = glass.size === 'S' ? 'Hello' : 'Hello from your own widget';
    const tick = () => {
      document.getElementById('t').textContent =
        new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: !(glass.cfg && glass.cfg.h24) });
    };
    tick();
    setInterval(tick, 1000);
  });

  // Other things you can use:
  //   glass.on('system', s => ...)   every second: { cpu, cores[], memUsed, memTotal, disks[{name,used,total}], uptime }
  //   glass.on('theme',  t => ...)   appearance changed (glass.dark is true in Dark)
  //   await glass.storage.get('key', fallback)   /   glass.storage.set('key', value)   saved per widget file
  //   glass.typing(true|false)       call while a text box has focus so it can receive keystrokes
  //   await glass.batteries()        { host, devices:[{name,pct,charging}] }
  //   glass.copy('text')             copy to the clipboard
</script>
