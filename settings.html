<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucent Settings</title>
  </head>
  <body>
    <div id="panel">
      <aside id="side">
        <div id="sidehead" data-drag>
          <div class="lights" id="lights">
            <button class="light close" data-act="close" aria-label="Close"><svg viewBox="0 0 8 8"><path d="m1.5 1.5 5 5m0-5-5 5"/></svg></button>
            <button class="light min" data-act="minimize" aria-label="Minimise"><svg viewBox="0 0 8 8"><path d="M1.2 4h5.6"/></svg></button>
            <button class="light zoom" disabled aria-label="Zoom unavailable"></button>
          </div>
        </div>
        <label id="search">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.4"/><path d="m15.4 15.4 5 5"/></svg>
          <input id="q" type="text" placeholder="Search" spellcheck="false" autocomplete="off" />
        </label>
        <nav id="nav"></nav>
      </aside>
      <main id="main">
        <header id="bar" data-drag>
          <button id="back" aria-label="Back"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4-8 8 8 8"/></svg></button>
          <button id="fwd" aria-label="Forward"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></button>
          <h1 id="title"></h1>
        </header>
        <div id="scroll"><div id="pane"></div></div>
      </main>
    </div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
