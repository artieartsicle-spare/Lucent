<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucent Settings</title>
  </head>
  <body>
    <div id="stage" data-drag>
      <div id="phone">
        <div id="screen">
          <div id="pages"></div>
          <div id="status" data-drag>
            <div class="sb-time" id="clock"></div>
            <div class="sb-island"></div>
            <div class="sb-icons">
              <svg width="20" height="13" viewBox="0 0 20 13" fill="currentColor"><rect x="0" y="8.5" width="3.4" height="4.5" rx="1"/><rect x="5.5" y="5.7" width="3.4" height="7.3" rx="1"/><rect x="11" y="2.8" width="3.4" height="10.2" rx="1"/><rect x="16.5" y="0" width="3.4" height="13" rx="1"/></svg>
              <svg width="18" height="13" viewBox="0 0 18 13" fill="currentColor"><path d="M9 2.6c2.4 0 4.6.9 6.3 2.5.1.1.3.1.4 0l1.2-1.2c.1-.1.1-.3 0-.4C14.8 1.2 12 0 9 0S3.2 1.2.9 3.5c-.1.1-.1.3 0 .4L2.1 5.1c.1.1.3.1.4 0C4.4 3.5 6.600 2.600 9 2.600zm0 4.100c1.300 0 2.500.5 3.400 1.300.1.1.3.1.4 0l1.200-1.200c.1-.1.1-.3 0-.4C12.900 5 11 4.200 9 4.200S5.100 5 3.900 6.200c-.1.1-.1.3 0 .4L5.100 7.800c.1.1.3.1.4 0C6.500 7.100 7.700 6.700 9 6.700zm2.100 2.300c.1-.1.100-.3 0-.4C10.500 8 9.800 7.700 9 7.700s-1.500.3-2.100.9c-.1.1-.1.3 0 .4l1.900 1.900c.1.1.3.1.4 0z"/></svg>
              <svg width="28" height="13" viewBox="0 0 28 13"><rect x=".5" y=".5" width="24" height="12" rx="3.800" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="21" height="9" rx="2.500" fill="currentColor"/><path d="M26 4.300v4.400c.8-.3 1.500-1.200 1.500-2.200s-.7-1.900-1.500-2.200z" fill="currentColor" opacity=".45"/></svg>
            </div>
          </div>
          <button id="home" aria-label="Home"><i></i></button>
          <div id="alerts"></div>
          <div id="islwrap">
            <div id="island" aria-label="Dynamic Island">
              <i class="lens"></i>
              <div class="isl-in">
                <button class="isl-btn min" id="isl-min" aria-label="Minimise"><i><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></i><span>Minimise</span></button>
                <button class="isl-btn exit" id="isl-exit" aria-label="Exit"><i><svg viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg></i><span>Exit</span></button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="grip" aria-label="Resize"></div>
    </div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
