<!doctype html>
<meta name="widget-name" content="System Meter">
<meta name="widget-description" content="CPU and memory as live bars.">
<meta name="widget-family" content="My Widgets">
<meta name="widget-size" content="S, M">
<style>
  body { display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .row .l { display: flex; justify-content: space-between; font: 600 11px/1 Inter, system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); margin-bottom: 6px; }
  .row .l b { color: var(--fg); font-weight: 600; }
  .bar { height: 8px; border-radius: 4px; background: var(--hair); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--fg); transition: width .6s ease; }
</style>
<div class="row"><div class="l"><span>CPU</span><b id="cv">0%</b></div><div class="bar"><i id="c"></i></div></div>
<div class="row"><div class="l"><span>Memory</span><b id="mv">0%</b></div><div class="bar"><i id="m"></i></div></div>
<script>
  glass.on('system', (s) => {
    const cpu = Math.round(s.cpu), mem = Math.round((s.memUsed / s.memTotal) * 100);
    c.style.width = cpu + '%'; cv.textContent = cpu + '%';
    m.style.width = mem + '%'; mv.textContent = mem + '%';
  });
</script>
